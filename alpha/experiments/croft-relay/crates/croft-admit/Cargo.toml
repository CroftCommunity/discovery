[package]
name = "croft-admit"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "Admission authority for an atproto-gated iroh relay: DID-bound enrollment, signed per-endpoint capability tokens, and tier->rate-bucket mapping. Relay-agnostic app-side core (no iroh dependency)."

[dependencies]
axum.workspace = true
tokio.workspace = true
jsonwebtoken.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
# Test-only: generate ed25519 keypairs for the token matrix. Production keys
# come from the enrollment service operator, not from this crate.
ring = "0.17"
# Test-only: drive the axum router with `oneshot` without binding a socket.
tower = { version = "0.5", features = ["util"] }
